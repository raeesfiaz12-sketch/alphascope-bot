name: AlphaScope Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/bot.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: alpha-scope-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start AlphaScope
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TRACKED_CHANNELS: ${{ secrets.TRACKED_CHANNELS }}
        run: |
          python bot.py
